<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>William's VR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
</head>
<body>
    <a-scene>
        <a-assets>
            <img id="art1" src="images/vlad.jpg" title="Image by annonymous on https://en.wikipedia.org/wiki/Vlad_the_Impaler#/media/File:Vlad_%C5%A2epe%C5%9F,_the_Impaler,_Prince_of_Wallachia_(1456-1462)_(died_1477).jpg" preload="auto">
            <img id="art2" src="images/gustavus.jpg" title="Image by Jacob Hoefnagel on https://en.wikipedia.org/wiki/Gustavus_Adolphus#/media/File:Attributed_to_Jacob_Hoefnagel_-_Gustavus_Adolphus,_King_of_Sweden_1611-1632_-_Google_Art_Project.jpg" preload="auto">
            <img id="art3" src="images/scotland.png" title="Image by unknown on https://en.wikipedia.org/wiki/Flag_of_Scotland#/media/File:Flag_of_Scotland.svg" preload="auto">
            <img id="art4" src="images/elliott.png" title="Image by Celtus on https://en.wikipedia.org/wiki/Clan_Eliott#/media/File:Clan_member_crest_badge_-_Clan_Eliott.svg" preload="auto">
            <img id="art5" src="images/door.jpg" title="Image by MichaelMaggs on https://en.wikipedia.org/wiki/Door#/media/File:Doorway_detail,_St_Magnus_Cathedral,_Kirkwall,_Orkney.jpg" preload="auto">
        </a-assets>
        <a-entity environment="preset: tron; dressingAmount: 130; skyColor:#8CFF66; skyType:color; dressing:towers; groundTexture:squares; dressingColor:#7A1B71; fog:0.67; groundColor:#FF5C00; groundColor2:#FFFFFF"></a-entity>
      <!-- Museum floor starts here -->
      <a-box id="floor" position="0 0 0" scale="10.5 10.5 0.1" rotation="90 0 0"color="red"></a-box>
      <a-box id="wall1" position="0 1.473 4.907" rotation="0 0 0" scale="10 3 0.2" color="red"></a-box>
      <a-box id="wall2" position="0 1.473 -4.907" rotation="0 0 0" scale="10 3 0.2" color="#3ec359"></a-box>
      <a-box id="wall3" position="5.049 1.454 -0.008" rotation="0 -90 0" scale="10 3 0.2" color="#3ec359"></a-box>
      <a-box id="wall4" position="-5.049 1.454 -0.008" rotation="0 -90 0" scale="10 3 0.2" color="#000000"></a-box>
      <a-cylinder id="triangle_front" segments-radial="3" position="0 3.874 4.907" rotation="-90 0 0" scale="5.774 0.2 1.8" color="red"></a-cylinder>
      <a-cylinder id="triangle_front" segments-radial="3" position="0 3.874 -4.907" rotation="-90 0 0" scale="5.774 0.2 1.8" color="red"></a-cylinder>
      <a-box id="roof_right" position="-2.599 4.321 -0.017" rotation="28.433 -90 0" scale="10.931 0.20 6.130" color="red"></a-box>
      <a-box id="roof_left" position="2.580 4.328 0" rotation="28.433 90 0" scale="10.931 0.20 6.110" color="red"></a-box>
      <!--Art stARTs here-->
      <a-plane id="art1" src="#art1" scale="2 2.5 0.05" rotation="0 0 0" position="-2.5 1.634 -4.792"></a-plane>
      <a-plane id="art2" src="#art2" scale="2 2.5 0.05" rotation="0 0 0" position="2.5 1.634 -4.792"></a-plane>
      <a-plane id="art3" src="#art3" scale="3 2 0.05" rotation="0 90 0" position="-4.91 1.634 0"></a-plane>
      <a-plane id="art4" src="#art4" scale="2 2 0.05" rotation="0 -90 0" position="4.91 1.634 0"></a-plane>
      <a-plane id="art5" src="#art5" scale="3 3.3 0.05" rotation="180 0 180" position="0 1.634 4.792"></a-plane>
      <a-plane id="art6" src="#art5" scale="3 3.3 0.05" rotation="0 0 0" position="0 1.634 5.2"></a-plane>
    </a-scene>
</body>
</html>
